name: Build MMDB

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - "LICENSE*"
      - "*.md"

jobs:
  build:
    name: Build MMDB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set variables
        run: |
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "RELEASE_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
        shell: bash

      - name: Install geoip CLI
        run: |
          # Устанавливаем Loyalsoldier/geoip CLI через go install
          go install -v github.com/Loyalsoldier/geoip@latest
          
          # Добавляем в PATH
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Download Country MMDB from Loyalsoldier/geoip
        run: |
          mkdir -p output
          curl -L -s "https://github.com/Loyalsoldier/geoip/releases/latest/download/Country-asn.mmdb" -o ./output/Country-source.mmdb
          
          # Проверяем размер
          size=$(stat -f %s ./output/Country-source.mmdb 2>/dev/null || echo "0")
          if [ "$size" -lt 100000 ]; then
            echo "ОШИБКА: Скачанный файл слишком маленький ($size байт)"
            exit 1
          fi
          echo "Файл скачан: $size байт"

      - name: Build custom MMDB
        run: |
          # Используем установленный geoip CLI
          geoip convert -c ./config.json

      - name: Verify mmdb files
        run: |
          cd ./output || exit 1
          go install github.com/maxmind/mmdbverify@latest
          for name in *.mmdb; do
            $(go env GOPATH)/bin/mmdbverify -file ${name}
          done
        continue-on-error: true

      - name: Generate sha256 checksum
        run: |
          cd ./output || exit 1
          for file in *.mmdb *.txt; do
            [ -f "$file" ] && sha256sum ${file} > ${file}.sha256sum
          done

      - name: Git push assets to "release" branch
        run: |
          cd output || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add -A
          git commit -m "${{ env.RELEASE_NAME }}" || exit 0
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release || exit 0

      - name: Upload files to GitHub release
        uses: softprops/action-gh-release@v1
        with:
          files: ./output/*
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
