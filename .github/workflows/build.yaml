name: Build MMDB

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - "LICENSE*"
      - "*.md"

jobs:
  build:
    name: Build MMDB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set variables
        run: |
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "RELEASE_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
        shell: bash

      - name: Install geoip CLI
        run: |
          go install -v github.com/Loyalsoldier/geoip@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Build custom MMDB
        run: |
          geoip convert -c ./config.json

      - name: List output files
        run: |
          echo "=== Содержимое output директории ==="
          ls -la ./output || echo "Директория не существует"
          echo "=== Проверка MMDB файла ==="
          ls -la ./output/*.mmdb || echo "MMDB файлы не найдены"

      - name: Generate sha256 checksum
        shell: bash
        run: |
          cd ./output || exit 1
          # Генерируем checksum только для существующих файлов
          shopt -s nullglob
          for file in *.mmdb *.txt; do
            if [ -f "$file" ]; then
              sha256sum ${file} > ${file}.sha256sum
              echo "Создан checksum: ${file}.sha256sum"
            fi
          done
          shopt -u nullglob

      - name: Verify mmdb files
        run: |
          cd ./output || exit 1
          go install github.com/maxmind/mmdbverify@latest
          shopt -s nullglob
          for name in *.mmdb; do
            if [ -f "$name" ]; then
              $(go env GOPATH)/bin/mmdbverify -file ${name}
            fi
          done
          shopt -u nullglob
        continue-on-error: true

      - name: Git push assets to "release" branch
        run: |
          cd output || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add -A
          git commit -m "${{ env.RELEASE_NAME }}" || exit 0
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release || exit 0

      - name: Upload files to GitHub release
        uses: softprops/action-gh-release@v1
        with:
          files: ./output/*
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
